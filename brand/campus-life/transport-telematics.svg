<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTelem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c24"/>
      <stop offset="60%" stop-color="#072d36"/>
      <stop offset="100%" stop-color="#021117"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="70%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <filter id="telemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgTelem)"/>

  <!-- Top Telematics Control HUD -->
  <g font-family="system-ui, sans-serif">
    <rect x="30" y="24" width="220" height="24" rx="4" fill="rgba(0,180,216,0.12)" stroke="#00b4d8" stroke-width="1"/>
    <circle cx="44" cy="36" r="4" fill="#00e676" filter="url(#telemGlow)"/>
    <text x="56" y="40" fill="#00b4d8" font-size="11" font-weight="800" letter-spacing="1.5">FLEET TELEMATICS &amp; SAFETY</text>
    
    <text x="30" y="76" fill="#ffffff" font-size="20" font-weight="900">REAL-TIME GPS TELEMETRY HUB</text>
    <text x="30" y="96" fill="#90e0ef" font-size="12" font-weight="600">Speed Governors &bull; Route Geofencing &bull; Mobile Parent Portal Tracking</text>
  </g>

  <!-- Left Main Display: Live Route Geo-Tracker Console -->
  <g transform="translate(30, 120)">
    <rect width="450" height="320" rx="12" fill="#031a22" stroke="rgba(0,180,216,0.3)" stroke-width="1.5"/>
    
    <!-- Mini Map Grid -->
    <path d="M 30,50 L 150,50 L 220,120 L 320,120 L 400,200" fill="none" stroke="#00b4d8" stroke-width="4" stroke-opacity="0.8"/>
    <path d="M 80,240 L 160,200 L 220,120 L 280,70 L 380,50" fill="none" stroke="#00e676" stroke-width="4" stroke-dasharray="6,4"/>
    <path d="M 120,290 L 220,260 L 320,200 L 420,200" fill="none" stroke="#ffd166" stroke-width="3"/>

    <!-- Moving Bus Indicators -->
    <g transform="translate(220, 120)">
      <circle r="14" fill="rgba(0,230,118,0.2)" filter="url(#telemGlow)"/>
      <circle r="8" fill="#00e676"/>
      <rect x="-35" y="-30" width="70" height="18" rx="4" fill="#021117" stroke="#00e676"/>
      <text x="0" y="-18" text-anchor="middle" fill="#00e676" font-size="9" font-weight="900" font-family="system-ui">BUS #14 • ON TIME</text>
    </g>

    <g transform="translate(320, 200)">
      <circle r="12" fill="rgba(255,209,102,0.2)"/>
      <circle r="7" fill="#ffd166"/>
      <rect x="-35" y="16" width="70" height="18" rx="4" fill="#021117" stroke="#ffd166"/>
      <text x="0" y="28" text-anchor="middle" fill="#ffd166" font-size="9" font-weight="900" font-family="system-ui">BUS #28 • 42 KM/H</text>
    </g>

    <g transform="translate(150, 50)">
      <circle r="10" fill="rgba(0,180,216,0.2)"/>
      <circle r="6" fill="#00b4d8"/>
      <rect x="-30" y="-28" width="60" height="18" rx="4" fill="#021117" stroke="#00b4d8"/>
      <text x="0" y="-16" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="900" font-family="system-ui">BUS #06 • 38 KM/H</text>
    </g>

    <!-- Console Footer Info -->
    <rect x="0" y="270" width="450" height="50" rx="0 0 12 12" fill="#021319" stroke="rgba(0,180,216,0.2)" stroke-width="1"/>
    <text x="20" y="295" fill="#ffffff" font-size="12" font-weight="800" font-family="system-ui">GPS REFRESH RATE: 2.5s</text>
    <text x="20" y="310" fill="#90e0ef" font-size="10" font-family="system-ui">Active Fleet Ping: 64 of 64 Buses Online &bull; Geofencing Active</text>
  </g>

  <!-- Right Display: Gauges & Safety Protocols -->
  <g transform="translate(505, 120)">
    <!-- Speed Governor Dial Box -->
    <rect width="265" height="150" rx="12" fill="#031a22" stroke="rgba(0,180,216,0.3)" stroke-width="1.5"/>
    <text x="16" y="26" fill="#80deea" font-size="11" font-weight="800" font-family="system-ui">SPEED GOVERNOR CALIBRATION</text>
    
    <!-- Speedometer Arc Graphic -->
    <path d="M 60,115 A 55 55 0 0 1 170,115" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60,115 A 55 55 0 0 1 145,70" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"/>
    <text x="115" y="105" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui">48</text>
    <text x="115" y="120" text-anchor="middle" fill="#00e676" font-size="10" font-weight="800" font-family="system-ui">KM/H MAX (SAFE)</text>
    <text x="200" y="70" fill="#00e676" font-size="11" font-weight="800" font-family="system-ui">&le; 50 KM/H</text>
    <text x="200" y="85" fill="#80deea" font-size="9" font-family="system-ui">RTO Speed Limit</text>
    <text x="200" y="105" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui">100% Compliant</text>

    <!-- Safety Features Card -->
    <rect y="165" width="265" height="155" rx="12" fill="#031a22" stroke="rgba(0,180,216,0.3)" stroke-width="1.5"/>
    <text x="16" y="190" fill="#80deea" font-size="11" font-weight="800" font-family="system-ui">ON-BOARD SAFETY MATRIX</text>
    
    <g transform="translate(16, 206)" font-family="system-ui" font-size="11">
      <text y="0" fill="#ffffff">✅ <b>Dual Emergency Egress Exits</b></text>
      <text y="24" fill="#ffffff">✅ <b>Automated First-Aid Kits</b></text>
      <text y="48" fill="#ffffff">✅ <b>Driver Breathalyzer Verified</b></text>
      <text y="72" fill="#ffffff">✅ <b>SOS Panic Alert Buttons</b></text>
    </g>
  </g>
</svg>
