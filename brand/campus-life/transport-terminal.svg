<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTerm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092015"/>
      <stop offset="60%" stop-color="#0e3323"/>
      <stop offset="100%" stop-color="#05170e"/>
    </linearGradient>
    <linearGradient id="bayG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <filter id="depotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgTerm)"/>

  <!-- Header -->
  <g font-family="system-ui, sans-serif">
    <rect x="30" y="24" width="230" height="24" rx="4" fill="rgba(0,230,118,0.12)" stroke="#00e676" stroke-width="1"/>
    <circle cx="44" cy="36" r="4" fill="#00e676" filter="url(#depotGlow)"/>
    <text x="56" y="40" fill="#00e676" font-size="11" font-weight="800" letter-spacing="1.5">CENTRAL BOARDING TERMINAL</text>
    
    <text x="30" y="76" fill="#ffffff" font-size="20" font-weight="900">CAMPUS TRANSIT TERMINAL &amp; DEPOT</text>
    <text x="30" y="96" fill="#a7f3d0" font-size="12" font-weight="600">Dedicated Platform Bays &bull; Digital RFID Passes &bull; RTO Safety Certified</text>
  </g>

  <!-- Left: 4 Boarding Platform Bay Display -->
  <g transform="translate(30, 120)">
    <rect width="470" height="320" rx="12" fill="#062417" stroke="rgba(0,230,118,0.25)" stroke-width="1.5"/>

    <!-- Bay 1 -->
    <g transform="translate(18, 18)">
      <rect width="434" height="64" rx="8" fill="#093120" stroke="rgba(0,230,118,0.3)"/>
      <rect x="12" y="14" width="56" height="36" rx="6" fill="#00e676"/>
      <text x="40" y="36" text-anchor="middle" fill="#022114" font-size="14" font-weight="900" font-family="system-ui">BAY 1</text>
      <text x="80" y="30" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Coimbatore Central &amp; Gandhipuram Corridor</text>
      <text x="80" y="46" fill="#86efac" font-size="11" font-family="system-ui">Buses #01, #04, #09 &bull; Departure: 04:45 PM &bull; Platform A</text>
      <circle cx="410" cy="32" r="6" fill="#00e676" filter="url(#depotGlow)"/>
    </g>

    <!-- Bay 2 -->
    <g transform="translate(18, 92)">
      <rect width="434" height="64" rx="8" fill="#093120" stroke="rgba(0,230,118,0.3)"/>
      <rect x="12" y="14" width="56" height="36" rx="6" fill="#ffd54f"/>
      <text x="40" y="36" text-anchor="middle" fill="#3e2723" font-size="14" font-weight="900" font-family="system-ui">BAY 2</text>
      <text x="80" y="30" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Tirupur &amp; Avinashi Highway Express</text>
      <text x="80" y="46" fill="#fde047" font-size="11" font-family="system-ui">Buses #12, #18, #22 &bull; Departure: 04:45 PM &bull; Platform B</text>
      <circle cx="410" cy="32" r="6" fill="#ffd54f"/>
    </g>

    <!-- Bay 3 -->
    <g transform="translate(18, 166)">
      <rect width="434" height="64" rx="8" fill="#093120" stroke="rgba(0,230,118,0.3)"/>
      <rect x="12" y="14" width="56" height="36" rx="6" fill="#38bdf8"/>
      <text x="40" y="36" text-anchor="middle" fill="#0c4a6e" font-size="14" font-weight="900" font-family="system-ui">BAY 3</text>
      <text x="80" y="30" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Pollachi, Kinathukadavu &amp; Eachanari</text>
      <text x="80" y="46" fill="#7dd3fc" font-size="11" font-family="system-ui">Buses #27, #31 &bull; Departure: 04:45 PM &bull; Platform C</text>
      <circle cx="410" cy="32" r="6" fill="#38bdf8"/>
    </g>

    <!-- Bay 4 -->
    <g transform="translate(18, 240)">
      <rect width="434" height="64" rx="8" fill="#093120" stroke="rgba(0,230,118,0.3)"/>
      <rect x="12" y="14" width="56" height="36" rx="6" fill="#c084fc"/>
      <text x="40" y="36" text-anchor="middle" fill="#3b0764" font-size="14" font-weight="900" font-family="system-ui">BAY 4</text>
      <text x="80" y="30" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Erode, Perundurai &amp; Mettupalayam Belts</text>
      <text x="80" y="46" fill="#d8b4fe" font-size="11" font-family="system-ui">Buses #38, #44, #52 &bull; Departure: 04:45 PM &bull; Platform D</text>
      <circle cx="410" cy="32" r="6" fill="#c084fc"/>
    </g>
  </g>

  <!-- Right: RFID Smart Card & Maintenance Depot -->
  <g transform="translate(520, 120)">
    <!-- Digital Pass Box -->
    <rect width="250" height="150" rx="12" fill="#062417" stroke="rgba(0,230,118,0.25)" stroke-width="1.5"/>
    <text x="16" y="26" fill="#6ee7b7" font-size="11" font-weight="800" font-family="system-ui">SMART BUS PASS SYSTEM</text>
    
    <!-- Smart Card Mockup -->
    <g transform="translate(16, 40)">
      <rect width="218" height="92" rx="8" fill="#0e3a27" stroke="#00e676" stroke-width="1.5"/>
      <circle cx="28" cy="30" r="10" fill="#00e676"/>
      <text x="46" y="26" fill="#ffffff" font-size="11" font-weight="800" font-family="system-ui">SIET SMART BUS PASS</text>
      <text x="46" y="38" fill="#86efac" font-size="9" font-family="system-ui">RFID Contactless Boarding</text>
      <line x1="16" y1="52" x2="202" y2="52" stroke="rgba(255,255,255,0.15)"/>
      <text x="16" y="70" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui">NAME: VISHAL KUMAR &bull; B.E. CSE</text>
      <text x="16" y="82" fill="#86efac" font-size="9" font-family="system-ui">ROUTE #14: PEELAMEDU &bull; SEAT #24</text>
    </g>

    <!-- Depot Inspection Box -->
    <rect y="165" width="250" height="155" rx="12" fill="#062417" stroke="rgba(0,230,118,0.25)" stroke-width="1.5"/>
    <text x="16" y="190" fill="#6ee7b7" font-size="11" font-weight="800" font-family="system-ui">DEPOT SAFETY PROTOCOL</text>
    
    <g transform="translate(16, 208)" font-family="system-ui" font-size="11">
      <text y="0" fill="#ffffff">🛠️ <b>Bi-Annual RTO Fitness Certs</b></text>
      <text y="24" fill="#ffffff">🧼 <b>Daily Disinfection &amp; Wash Bays</b></text>
      <text y="48" fill="#ffffff">🔧 <b>On-Site Mechanical Service Depot</b></text>
      <text y="72" fill="#ffffff">🚨 <b>24/7 Breakdown Recovery Van</b></text>
    </g>
  </g>
</svg>
