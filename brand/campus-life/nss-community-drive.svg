<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072230"/>
      <stop offset="60%" stop-color="#0a354c"/>
      <stop offset="100%" stop-color="#04151e"/>
    </linearGradient>
    <linearGradient id="nssG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="nssGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgNss)"/>

  <!-- Header -->
  <g font-family="system-ui, sans-serif">
    <rect x="30" y="24" width="280" height="24" rx="4" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="44" cy="36" r="4" fill="#38bdf8" filter="url(#nssGlow)"/>
    <text x="56" y="40" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.5">NATIONAL SERVICE SCHEME (NSS)</text>
    
    <text x="30" y="76" fill="#ffffff" font-size="20" font-weight="900">RURAL OUTREACH &amp; COMMUNITY HEALTH</text>
    <text x="30" y="96" fill="#bae6fd" font-size="12" font-weight="600">Motto: "Not Me, But You" &bull; 7-Day Residential Village Camps &bull; 500+ Units Blood Drives</text>
  </g>

  <!-- Left: 4 Pillars of Community Outreach -->
  <g transform="translate(30, 120)">
    <rect width="470" height="320" rx="12" fill="#08293a" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>

    <!-- Pillar 1: Blood Donation -->
    <g transform="translate(20, 20)">
      <rect width="430" height="60" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.2)"/>
      <text x="16" y="26" fill="#f87171" font-size="13" font-weight="800" font-family="system-ui">🩸 500+ UNITS ANNUAL BLOOD DONATION CAMPS</text>
      <text x="16" y="46" fill="#e0f2fe" font-size="11" font-family="system-ui">Organized with Coimbatore Government Medical College Blood Bank for emergency trauma wards.</text>
    </g>

    <!-- Pillar 2: Village Adoption -->
    <g transform="translate(20, 92)">
      <rect width="430" height="60" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.2)"/>
      <text x="16" y="26" fill="#38bdf8" font-size="13" font-weight="800" font-family="system-ui">🏡 7-DAY ADOPTED VILLAGE TRANSFORMATION CAMPS</text>
      <text x="16" y="46" fill="#e0f2fe" font-size="11" font-family="system-ui">Volunteers live in rural hamlets constructing soak pits, sanitation facilities, and chlorinating wells.</text>
    </g>

    <!-- Pillar 3: Free Eye & Health Checkups -->
    <g transform="translate(20, 164)">
      <rect width="430" height="60" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.2)"/>
      <text x="16" y="26" fill="#4ade80" font-size="13" font-weight="800" font-family="system-ui">🩺 FREE SPECIALTY HEALTH &amp; EYE SCREENING CLINICS</text>
      <text x="16" y="46" fill="#e0f2fe" font-size="11" font-family="system-ui">Screening over 1,500 rural elders for cataract surgeries and diabetes with top hospital tie-ups.</text>
    </g>

    <!-- Pillar 4: Rural Literacy & STEM -->
    <g transform="translate(20, 236)">
      <rect width="430" height="60" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.2)"/>
      <text x="16" y="26" fill="#fde047" font-size="13" font-weight="800" font-family="system-ui">📚 RURAL SCHOOL DIGITAL LITERACY &amp; SCIENCE KITS</text>
      <text x="16" y="46" fill="#e0f2fe" font-size="11" font-family="system-ui">Teaching foundational computing, robotics basics, and mathematics kits in local government schools.</text>
    </g>
  </g>

  <!-- Right: Social Impact Numbers -->
  <g transform="translate(520, 120)">
    <rect width="250" height="320" rx="12" fill="#08293a" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    <text x="18" y="30" fill="#38bdf8" font-size="12" font-weight="800" font-family="system-ui">ANNUAL SOCIAL FOOTPRINT</text>

    <g transform="translate(18, 50)" font-family="system-ui">
      <rect width="214" height="68" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.25)"/>
      <text x="12" y="24" fill="#4ade80" font-size="18" font-weight="900">2,000+ TREES</text>
      <text x="12" y="42" fill="#ffffff" font-size="11" font-weight="700">Native Sapling Green Belt</text>
      <text x="12" y="56" fill="#94a3b8" font-size="9">Planted across 6 neighboring villages</text>

      <rect y="80" width="214" height="68" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.25)"/>
      <text x="12" y="104" fill="#38bdf8" font-size="18" font-weight="900">12+ CAMPS</text>
      <text x="12" y="122" fill="#ffffff" font-size="11" font-weight="700">Rural Welfare Projects</text>
      <text x="12" y="136" fill="#94a3b8" font-size="9">Sanitation, water testing &amp; awareness</text>

      <rect y="160" width="214" height="88" rx="8" fill="#0c3c54" stroke="rgba(56,189,248,0.25)"/>
      <text x="12" y="184" fill="#f87171" font-size="18" font-weight="900">15+ DRIVES</text>
      <text x="12" y="202" fill="#ffffff" font-size="11" font-weight="700">Voluntary Blood Drives</text>
      <text x="12" y="218" fill="#e0f2fe" font-size="10">Recognized by TN State AIDS</text>
      <text x="12" y="234" fill="#e0f2fe" font-size="10">Control Society with Gold Citation</text>
    </g>
  </g>
</svg>
